# Tier-2 CI (TODO backlog item): the cross-repo conformance heartbeat —
# a real GoLean campaign, nightly and on demand. Deliberately decoupled
# from the per-push gate: it needs a private-repo checkout and a Lean
# toolchain, and its verdicts are findings to triage, not build health.
#
# REQUIRED SECRET: GOLEAN_DEPLOY_KEY — the private half of a deploy key
# on OathTech/golean. Setup (once):
#   ssh-keygen -t ed25519 -N "" -f golean-deploy -C grossmith-nightly
#   golean repo  -> Settings -> Deploy keys -> add golean-deploy.pub
#                  (leave "Allow write access" UNCHECKED)
#   grossmith    -> Settings -> Secrets and variables -> Actions ->
#                  new secret GOLEAN_DEPLOY_KEY = contents of golean-deploy
# A deploy key is repo-scoped, read-only, and identity-free — the right
# shape for a clone-only cross-repo link (a PAT is person-bound and
# expires; a GitHub App is the step up if more repo pairs ever need this).
#
# GOLEAN REVISION: the campaign checks out the GoLean commit named in
# deps/golean.pin (a full SHA), never GoLean's moving main. A red night
# is then attributable to a grossmith change, a deliberate pin bump, or
# the night's new seed window — not to whatever landed upstream after
# dark. Bump the pin in its own commit. A workflow_dispatch run may name
# another GoLean ref (golean_ref) to try a candidate without moving the
# pin; the run's summary says when the pin is not in force.
#
# SEED WINDOWS: case i of a campaign uses seed BASE+i. BASE is the UTC
# date times 10000, so consecutive nights draw DISJOINT windows. (With
# BASE = the bare date, nights overlapped in all but one seed: a single
# finding re-failed every night for weeks and masked the heartbeat, and
# only one new program was explored per night.) The window is printed
# and recorded in batch.json's seeds, so any case regenerates from its
# seed alone.
#
# Failure policy (mirrors the verdict taxonomy's meaning):
#   harness-error / reference-infra-failure  -> FAIL (our side broke)
#   observation-mismatch                     -> FAIL (a conformance
#       finding — the loud page is the point; triage, then either fix
#       lands upstream or the case is pinned as a known divergence)
#   clone-infra-failure                      -> allowed (their fail-closed
#       coverage gaps; the count is printed and archived, never hidden)
# The judge step names every non-match case (id, per-case seed, subject
# hash, detail) as an annotation, so triage starts from the run page.
name: golean-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: campaign size (1..10000)
        default: "300"
      golean_ref:
        description: GoLean ref to run against instead of deps/golean.pin (empty = the pin)
        default: ""

jobs:
  # The gc-386 discrimination proof: divergences must exist AND all fall
  # inside the declared width_dependent quotient. Runs here rather than
  # per-push (it is a nightly proof, not build health) and here rather
  # than locally (a 2026-08-08 sandbox change SIGTRAPs 386 ELF on the
  # dev host; runners execute ia32 fine). Needs no secrets.
  cross-arch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 32-bit execution sanity
        run: |
          mkdir -p "$RUNNER_TEMP/m" && cd "$RUNNER_TEMP/m"
          printf 'package main\nfunc main(){println(42)}\n' > main.go
          printf 'module m\n\ngo 1.26\n' > go.mod
          GOARCH=386 go build -o m386 . && ./m386
      - name: discrimination campaign
        run: |
          SEED="$(( $(date -u +%Y%m%d) * 10000 ))"
          echo "seed window: $SEED .. $((SEED + 299))"
          go run ./cmd/gengo -n 300 -seed "$SEED" \
            -out "$RUNNER_TEMP/x386" -clone gc-386 | tee "$RUNNER_TEMP/x386.log"
          B="$RUNNER_TEMP/x386/batch.json"
          jq '{verdicts: .verdicts}' "$B"
          # Tag honesty: any untagged divergence breaks the proof.
          ! grep -q "UNTAGGED divergence" "$RUNNER_TEMP/x386.log"
          # Not vacuous (the clone actually ran), nothing broke on our
          # side, and divergences EXIST — a zero would mean the
          # observation went blind to width.
          jq -e '(.verdicts["harness-error"] // 0) == 0
             and (.verdicts["reference-infra-failure"] // 0) == 0
             and ((.verdicts["clone-infra-failure"] // 0) < .total)
             and ((.verdicts["observation-mismatch"] // 0) > 0)' "$B"
      - name: archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-arch-${{ github.run_id }}
          path: ${{ runner.temp }}/x386/batch.json
          if-no-files-found: warn

  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAVE_KEY: ${{ secrets.GOLEAN_DEPLOY_KEY != '' }}
      GOTOOLCHAIN: local
      # Dispatch inputs reach shell only through env (never interpolated
      # into a script: a crafted input would otherwise run as code).
      CASES_INPUT: ${{ github.event.inputs.cases }}
      GOLEAN_REF_INPUT: ${{ github.event.inputs.golean_ref }}
    steps:
      - name: require deploy key
        if: env.HAVE_KEY != 'true'
        run: |
          echo "GOLEAN_DEPLOY_KEY is not configured; see the header comment for one-time setup." >&2
          exit 1
      - uses: actions/checkout@v4
      - name: resolve GoLean revision
        id: golean
        run: |
          if [[ -n "$GOLEAN_REF_INPUT" ]]; then
            REF="$GOLEAN_REF_INPUT"
            echo "::warning::GoLean ref overridden by dispatch input: $REF (deps/golean.pin is NOT in force for this run)"
            echo "GoLean ref (dispatch override): $REF" >> "$GITHUB_STEP_SUMMARY"
          else
            REF="$(grep -v '^[[:space:]]*#' deps/golean.pin | grep -m1 -v '^[[:space:]]*$' | tr -d '[:space:]')"
            if [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "deps/golean.pin must name a full 40-hex GoLean commit; got '$REF'" >&2
              exit 1
            fi
            echo "GoLean pin: $REF" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OathTech/golean
          ref: ${{ steps.golean.outputs.ref }}
          ssh-key: ${{ secrets.GOLEAN_DEPLOY_KEY }}
          path: deps/golean
          # Full history: the integration witnesses confirm the checkout
          # descends from a minimum GoLean revision (merge-base
          # --is-ancestor), which a depth-1 clone cannot answer.
          fetch-depth: 0
      - name: read GoLean oracle version
        id: oracle
        run: |
          git -C deps/golean log -1 --format='GoLean checkout: %H %cs %s' | cut -c1-200
          PIN="$(head -1 deps/golean/baselines/go-oracle-pin | tr -d '[:space:]')"
          if [[ ! "$PIN" =~ ^go[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid GoLean oracle version: $PIN" >&2
            exit 1
          fi
          echo "version=${PIN#go}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          # go.mod declares a language version, not GoLean's exact oracle.
          go-version: ${{ steps.oracle.outputs.version }}
      - name: verify GoLean oracle version
        run: |
          PIN="$(head -1 deps/golean/baselines/go-oracle-pin | tr -d '[:space:]')"
          LIVE="$(go env GOVERSION)"
          if [[ "$LIVE" != "$PIN" ]]; then
            echo "Go toolchain $LIVE differs from GoLean oracle $PIN" >&2
            exit 1
          fi
      - name: install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # restore/save instead of actions/cache: the single action saves
      # only in its post step, which runs only when the JOB succeeds — so
      # every red night (a conformance finding, the normal red) rebuilt
      # GoLean from scratch (~10 min). Saving right after lake build
      # keeps the build cached whatever the verdicts say. The key carries
      # the GoLean revision; the prefix fallback restores the previous
      # revision's build for lake to update incrementally.
      - name: restore lake build cache
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/golean/.lake
            ~/.elan
          key: lake-${{ hashFiles('deps/golean/lean-toolchain', 'deps/golean/lake-manifest.json') }}-${{ steps.golean.outputs.ref }}
          restore-keys: |
            lake-${{ hashFiles('deps/golean/lean-toolchain', 'deps/golean/lake-manifest.json') }}-
      - name: lake build
        run: cd deps/golean && lake build
      - name: save lake build cache
        if: steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps/golean/.lake
            ~/.elan
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - name: GoLean integration witnesses
        env:
          GOLEAN_CHECKOUT: ${{ github.workspace }}/deps/golean
        # A renamed or deleted witness would otherwise pass as "no tests
        # to run": each named test must report its own top-level PASS.
        run: |
          set -o pipefail
          missing=0
          witness() {
            local pkg=$1; shift
            local re log
            re="^($(IFS='|'; echo "$*"))\$"
            log="$RUNNER_TEMP/witness-$(basename "$pkg").log"
            go test -count=1 -v -run "$re" "$pkg" | tee "$log"
            for name in "$@"; do
              if ! grep -Eq "^--- PASS: ${name} \(" "$log"; then
                echo "::error::$name did not run and pass in $pkg" >&2
                missing=1
              fi
            done
          }
          witness ./golean TestGoLeanChoiceDepth TestGoLeanByteStrings TestGoLeanAssignmentBeforePanic
          witness ./cmd/gengo TestCheckGoLeanCurrentDriver TestCheckGoLeanPanicMessages
          exit "$missing"
      - name: campaign
        run: |
          N="${CASES_INPUT:-300}"
          if [[ ! "$N" =~ ^[0-9]+$ ]] || (( N < 1 || N > 10000 )); then
            echo "cases must be an integer in 1..10000; got '$N'" >&2
            exit 1
          fi
          SEED="$(( $(date -u +%Y%m%d) * 10000 ))"
          echo "seed window: $SEED .. $((SEED + N - 1))" | tee -a "$GITHUB_STEP_SUMMARY"
          go run ./cmd/gengo -n "$N" -seed "$SEED" -out "$RUNNER_TEMP/campaign" -clone golean
      - name: judge the verdicts
        run: |
          B="$RUNNER_TEMP/campaign/batch.json"
          jq '{clone: .cloneIdentity, generator: .generatorRev, seeds: .seeds, verdicts: .verdicts, wrapperCaught: .wrapperCaught, wrapperJudged: .wrapperJudged}' "$B"
          # Name every non-match case on the run page: id, the per-case
          # seed (regenerate with `gengo -n 1 -seed <seed> -clone golean`),
          # the subject hash (the stable handle once the window moves on),
          # and the clone's detail.
          jq -r '.seeds[0] as $base | .cases[] | select(.verdict != "match")
            | "::error title=\(.verdict) \(.id)::seed \($base + (.id | ltrimstr("case_") | tonumber)) subject \(.subjectSha256[0:12]) — \((.detail // "") | gsub("[\r\n]"; " ") | .[0:600])"' "$B"
          # Non-vacuity added per the 2026-08-08 review follow-up (F7): a
          # frontend regression turning EVERY case clone-infra previously
          # passed green, and a regression back to caught-without-judged
          # (the G1 state) was invisible.
          # The wrapper gate is the EXACT three-leg identity (mid-arc
          # review finding 1): caught == judged + wrapperCloneInfra. A
          # wrapped subject may be quarantined for an unrelated reason
          # (W2: short-circuit wit calls), but the excuse is counted over
          # the WRAPPER population itself, never borrowed from the global
          # clone-infra count — a bound against the global count admitted
          # a two-thirds judgement regression. The G1 tripwire (judged
          # nonzero whenever caught is) stays as a second line.
          jq -e '(.verdicts["harness-error"] // 0) == 0
             and (.verdicts["reference-infra-failure"] // 0) == 0
             and (.verdicts["observation-mismatch"] // 0) == 0
             and ((.verdicts["clone-infra-failure"] // 0) < .total)
             and ((.wrapperJudged // -1) >= 0)
             and ((.wrapperCloneInfra // -1) >= 0)
             and ((.wrapperCaught // 0) == ((.wrapperJudged // 0) + (.wrapperCloneInfra // 0)))
             and (((.wrapperCaught // 0) == 0) or ((.wrapperJudged // 0) > 0))' "$B"
      - name: archive the conformance statement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/campaign/batch.json
            ${{ runner.temp }}/campaign/manifest.tsv
            ${{ runner.temp }}/campaign/golean-work/diff-coverage.log
            ${{ runner.temp }}/campaign.staging/golean-work/diff-coverage.log
          if-no-files-found: warn
