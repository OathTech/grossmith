# Tier-2 CI (TODO backlog item): the cross-repo conformance heartbeat —
# a real GoLean campaign, nightly and on demand. Deliberately decoupled
# from the per-push gate: it needs a private-repo checkout and a Lean
# toolchain, and its verdicts are findings to triage, not build health.
#
# REQUIRED SECRET: GOLEAN_DEPLOY_KEY — the private half of a deploy key
# on OathTech/golean. Setup (once):
#   ssh-keygen -t ed25519 -N "" -f golean-deploy -C grossmith-nightly
#   golean repo  -> Settings -> Deploy keys -> add golean-deploy.pub
#                  (leave "Allow write access" UNCHECKED)
#   grossmith    -> Settings -> Secrets and variables -> Actions ->
#                  new secret GOLEAN_DEPLOY_KEY = contents of golean-deploy
# A deploy key is repo-scoped, read-only, and identity-free — the right
# shape for a clone-only cross-repo link (a PAT is person-bound and
# expires; a GitHub App is the step up if more repo pairs ever need this).
#
# Failure policy (mirrors the verdict taxonomy's meaning):
#   harness-error / reference-infra-failure  -> FAIL (our side broke)
#   observation-mismatch                     -> FAIL (a conformance
#       finding — the loud page is the point; triage, then either fix
#       lands upstream or the case is pinned as a known divergence)
#   clone-infra-failure                      -> allowed (their fail-closed
#       coverage gaps; the count is printed and archived, never hidden)
name: golean-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: campaign size
        default: "300"

jobs:
  # The gc-386 discrimination proof: divergences must exist AND all fall
  # inside the declared width_dependent quotient. Runs here rather than
  # per-push (it is a nightly proof, not build health) and here rather
  # than locally (a 2026-08-08 sandbox change SIGTRAPs 386 ELF on the
  # dev host; runners execute ia32 fine). Needs no secrets.
  cross-arch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 32-bit execution sanity
        run: |
          mkdir -p "$RUNNER_TEMP/m" && cd "$RUNNER_TEMP/m"
          printf 'package main\nfunc main(){println(42)}\n' > main.go
          printf 'module m\n\ngo 1.26\n' > go.mod
          GOARCH=386 go build -o m386 . && ./m386
      - name: discrimination campaign
        run: |
          go run ./cmd/gengo -n 300 -seed "$(date -u +%Y%m%d)" \
            -out "$RUNNER_TEMP/x386" -clone gc-386 | tee "$RUNNER_TEMP/x386.log"
          B="$RUNNER_TEMP/x386/batch.json"
          jq '{verdicts: .verdicts}' "$B"
          # Tag honesty: any untagged divergence breaks the proof.
          ! grep -q "UNTAGGED divergence" "$RUNNER_TEMP/x386.log"
          # Not vacuous (the clone actually ran), nothing broke on our
          # side, and divergences EXIST — a zero would mean the
          # observation went blind to width.
          jq -e '(.verdicts["harness-error"] // 0) == 0
             and (.verdicts["reference-infra-failure"] // 0) == 0
             and ((.verdicts["clone-infra-failure"] // 0) < .total)
             and ((.verdicts["observation-mismatch"] // 0) > 0)' "$B"
      - name: archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-arch-${{ github.run_id }}
          path: ${{ runner.temp }}/x386/batch.json
          if-no-files-found: warn

  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAVE_KEY: ${{ secrets.GOLEAN_DEPLOY_KEY != '' }}
    steps:
      - name: require deploy key
        if: env.HAVE_KEY != 'true'
        run: |
          echo "GOLEAN_DEPLOY_KEY is not configured; see the header comment for one-time setup." >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OathTech/golean
          ssh-key: ${{ secrets.GOLEAN_DEPLOY_KEY }}
          path: deps/golean
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: cache lake build
        uses: actions/cache@v4
        with:
          path: |
            deps/golean/.lake
            ~/.elan
          key: lake-${{ hashFiles('deps/golean/lean-toolchain', 'deps/golean/lake-manifest.json') }}
      - name: lake build
        run: cd deps/golean && lake build
      - name: campaign
        run: |
          N="${{ github.event.inputs.cases || '300' }}"
          SEED="$(date -u +%Y%m%d)"
          go run ./cmd/gengo -n "$N" -seed "$SEED" -out "$RUNNER_TEMP/campaign" -clone golean
      - name: judge the verdicts
        run: |
          B="$RUNNER_TEMP/campaign/batch.json"
          jq '{clone: .cloneIdentity, verdicts: .verdicts, wrapperCaught: .wrapperCaught, wrapperJudged: .wrapperJudged}' "$B"
          # Non-vacuity added per the 2026-08-08 hunt (F7): a frontend
          # regression turning EVERY case clone-infra previously passed
          # green, and a regression back to caught-without-judged (the
          # G1 state) was invisible.
          jq -e '(.verdicts["harness-error"] // 0) == 0
             and (.verdicts["reference-infra-failure"] // 0) == 0
             and (.verdicts["observation-mismatch"] // 0) == 0
             and ((.verdicts["clone-infra-failure"] // 0) < .total)
             and ((.wrapperJudged // -1) == (.wrapperCaught // 0))' "$B"
      - name: archive the conformance statement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/campaign/batch.json
            ${{ runner.temp }}/campaign/golean-work/diff-coverage.log
          if-no-files-found: warn
