# Tier-1 CI (TODO backlog item): everything here runs on a bare runner
# with only a Go toolchain. The golean end-to-end test self-skips when
# deps/golean is absent, and every generated case dir carries its own
# throwaway go.mod (the module-mode fix), so no repo-external setup is
# needed. The GoLean campaign is tier 2 (golean-nightly.yml), never a
# push gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: witness suite
        run: go test -count=1 ./...
      - name: race (pure logic; -short skips the binary-building witnesses)
        run: go test -race -short -count=1 ./...
      - name: race, resource witnesses
        # The E4/E5 subprocess witnesses under the race detector too —
        # the plain -short race leg skips them (E5: previously they ran
        # only without -race).
        run: go test -race -count=1 -run 'TestStalledCompilerIsBounded|TestUnboundedSubjectOutputHitsTheCap|TestIdentityProbesBounded' ./harness/
      - name: conformance smoke
        # A 50-case judged batch must run 50/50 on the reference — catches
        # driver/toolchain regressions the unit witnesses cannot (the
        # BRIEF's mechanically-checkable acceptance, shrunk to CI size).
        run: |
          go run ./cmd/gengo -n 50 -seed 1 -out "$RUNNER_TEMP/smoke" -judge
          jq -e '.schema == "grossmith-batch-v1" and .total == 50 and .refRan == 50' \
            "$RUNNER_TEMP/smoke/batch.json"
      - name: verify smoke
        # -verify on the batch CI just produced, plus one edit it must
        # catch (E5: the arc-end review found -verify exercised by
        # nothing, and its report binding refuted by a hand edit).
        # This step exercises the INTEGRITY layer end to end through the
        # CLI. The other claim — a report whose bytes are honestly bound
        # but whose MEANING is false — is the mutation table in
        # harness/report_test.go, which re-binds complete.json after each
        # mutation and runs in the witness-suite step above (2026-08-10
        # audit: it asked for exactly that negative test).
        run: |
          go run ./cmd/gengo -verify "$RUNNER_TEMP/smoke"
          sed -i 's/"total": 50/"total": 99999/' "$RUNNER_TEMP/smoke/batch.json"
          if go run ./cmd/gengo -verify "$RUNNER_TEMP/smoke"; then
            echo "verify accepted an edited report" >&2; exit 1
          fi
          sed -i 's/"total": 99999/"total": 50/' "$RUNNER_TEMP/smoke/batch.json"
          go run ./cmd/gengo -verify "$RUNNER_TEMP/smoke"
      - name: replay smoke
        # The Phase 3 done-when as a CI check: a case regenerates from its
        # record alone, byte- and observation-identical.
        run: go run ./cmd/gengo -replay "$RUNNER_TEMP/smoke/case_00007"
